id: CIRCDIST.lift
role: outcome
aliases:
- CLOSED-LIFT
claim: In graph-like detector error models with fixed boundaries, a proven necessary-and-sufficient
  structural criterion (in graph-covering, voltage-graph, or chain-complex form) characterizes when
  d_circ = d_eff, of the shape "d_circ equals the minimum over nontrivial effective logicals gamma
  of the length of the shortest closed spacetime lift of gamma", with zero time-direction
  voltage/monodromy as the equal-weight liftability condition; the criterion recovers the
  non-interleaved equality d_circ = d_eff as a corollary and is accompanied by an explicit
  interleaved example with d_circ > d_eff.
assessment:
  level: CERTIFIED*
  caveats:
  - Single same-stack (Opus 5) independent review chain; no cross-stack or human verification
    (the C-R2 stack-identity question for one child's reviewer is UNDETERMINABLE-FROM-DISK and
    does not lift this ceiling).
  - 'BINDING (review condition): "graph-like" in this claim is pinned PER-SECTOR (iff Def
    1.12, sector-indexed); under the whole-DEM reading the existential clause fails.'
  - 'BINDING (review condition, C-M7): the criterion clause carries Theorem 5.7''s R >= d
    hypothesis; the claim as certified is quantified over memory experiments with R >= d rounds.'
  - The repair >= 3 regime, min-cost-covering extension, and large proposer scans remain
    excluded, per the children's certifications.
  - Under the min-over-sectors convention the [[4,2,2]] witness is the sole load-bearing
    example for the existential clause (Steane witnesses a single sector only).
  summary: 'Promoted CONJECTURED -> CERTIFIED* 2026-08-22: the root composition proof
    (assembly + Amendment 1) passed focused independent re-review
    (artifacts/circdist_amendments4_review_20260822.md, item 1) with every load-bearing
    computation re-derived on a fresh simulator; clearance hash-bound to this claim. 课题二
    (closed-lift characterization) is closed at the same-stack ceiling. Round-1 recon (2026-08-20) decomposed the claim into three components and delivered the
    third at NUMERICAL: an explicit [[4,2,2]] interleaved circuit with d_eff = 1 < d_circ = 2 (see
    CIRCDIST.lift.gap-example). Blueprint: the criterion (CIRCDIST.lift.iff, three alternative
    formalizations), the non-interleaved corollary (CIRCDIST.lift.nonint), and the example jointly
    are the claim. Literature verification (artifacts/circdist_lift_litverify_20260820.md) pinned
    all load-bearing references and found the target sits in open territory (Guemard
    arXiv:2404.16736 Remark 3.14 leaves lifted-code distance open). Cross-root coupling: this
    criterion is the only mechanism by which CIRCDIST.gross can reach 12 (gross recon proved
    d_ext <= 11 for every schedule at NUMERICAL level), and the iff routes'' finite-window premise
    is CIRCDIST.sat''s target theorem.'
  basis:
    routes:
    - criterion-corollary-example
    reviews:
    - path: artifacts/circdist_amendments4_review_20260822.md
      kind: review
      scope: Focused re-review clearing the root assembly for promotion at the CERTIFIED*
        ceiling; independent bitmask-simulator re-derivation of F1's computations in both
        sectors; F2/F3 confirmed at source.
      locator: Item 1
      reviewed_hash: sha256:ccad7fa605be1ae14a2dbc1d6c5758300bb8a5f0a3023fcef84725be40e78d8a
routes:
  criterion-corollary-example:
    premises:
    - CIRCDIST.lift.iff
    - CIRCDIST.lift.nonint
    - CIRCDIST.lift.gap-example
    implication: The claim is the conjunction of its three components — the iff criterion with the
      intrinsic-voltage non-vacuity bar, the non-interleaved corollary derived inside the same
      framework, and the explicit strict-inequality example; assembling them is definitional
      bookkeeping plus consistency of the three formalizations.
    proof:
      sketch: Near-definitional assembly; the only content is that all three components speak the
        same framework language (the winning iff formalization).
      sources:
      - path: artifacts/circdist_lift_recon_20260820.md
        kind: text
    assessment:
      level: CERTIFIED*
      caveats:
      - Same caveat set as the node assessment (the route's composition proof is the assembled
        document under its Amendment 1).
      summary: The composition proof is the assembled prose document plus Amendment 1, reviewed
        and cleared at item 1 of the focused re-review; F1/F2/F3 binding conditions recorded in
        the node caveats.
      basis:
        reviews:
        - path: artifacts/circdist_amendments4_review_20260822.md
          kind: review
          scope: Focused re-review of the assembly's Amendment 1 (F1-F3, R4/R6 foldins) plus
            independent re-derivation of the per-sector and whole-DEM computations.
          locator: Item 1
          reviewed_hash: sha256:f39c83e6efdcc0487691df0eec57f4fe3d28d8d30c381ad7bf730fdfdfca8eda
