id: CIRCDIST.sat.transfer
role: proof
aliases:
- SAT-TRANSFER
claim: For each fixed legal single-round single-ancilla CSS schedule M under the stated ideal
  temporal boundaries and unit-fault model, there is an explicitly constructible finite min-plus
  transfer system (u,A,v) such that d_R(M) = u^T min-plus A^R min-plus v for every R, with the two
  CSS sectors, boundary conditions, unreachable states, and logical terminal condition represented
  exactly.
assessment:
  level: CONJECTURED
  summary: 'The recon gives a substantive construction: for one CSS sector it proposes the state
    space Sigma = F_2^n/rowspace(H_X), the single-round fault dictionary w_M(delta,mu), transition
    weights A[E,E''] = w_M([E''+E],H_Z E), and boundary vectors u,v. An exact implementation for
    rotated surface d=3 reproduces the independent Stim distances for four schedules over the
    tested windows. This licenses CONJECTURED plus numerical corroboration, not NUMERICAL for the
    universal claim: the written derivation still must prove exact correspondence for arbitrary
    legal schedules, both sectors, boundary vectors, repeated-round composition, and logical
    terminal classes.'
  basis:
    runs:
    - path: artifacts/circdist_sat_recon_20260820.md
      kind: run
      scope: Exact min-plus implementation for four rotated-surface-code d=3 schedules, compared
        with an independent Stim detector-model calculation for R=1 through 10.
      result: Every transfer sequence was constant (2 or 3 according to schedule) and agreed with
        the independent calculation throughout the tested window.
    evidence:
    - path: artifacts/circdist_sat_recon_20260820.md
      kind: text
frontier:
  task-001:
    task: Turn the candidate construction into a general proof, including a bidirectional mapping
      between multi-round fault sets and transfer paths, both CSS sectors, exact initial/final
      boundary vectors, unreachable states, and the terminal logical condition.
    kind: task
    since: '2026-08-22'
  task-002:
    task: Package the implementation and the d=3 comparison as a reproducible command/output
      record whose search space, code/schedule inputs, and agreement criterion are explicit.
    kind: task
    since: '2026-08-22'
