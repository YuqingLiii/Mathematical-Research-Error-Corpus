id: CIRCDIST.lift.nonint
role: proof
aliases:
- LIFT-NONINT
claim: Within the closed-lift framework, every non-interleaved schedule satisfies d_circ = d_eff,
  derived (not assumed) from the framework — every minimum-weight effective fault admits a
  horizontal representative, so the spacetime graph decomposes as R disjoint copies of G_eff.
assessment:
  level: CERTIFIED*
  caveats:
  - Single same-stack (Opus 5) review; no cross-stack or human verification yet.
  - The reviewer's exhaustive verification covers Def 2.8 + Lemma 7.2 (the collision/weight
    accounting) and 112 non-interleaved configurations across 4 codes at R = 1..4, including a
    [[15,7,3]] Hamming-CSS instance with Z-degree 4 and overlaps up to 8; scope beyond these
    finite checks rests on the reviewed prose derivation.
  summary: 'Promoted NUMERICAL -> CERTIFIED* 2026-08-20: adversarial independent review
    (artifacts/circdist_lift_proofs_review_20260820.md) CONFIRMS Theorem 7.1 line-by-line and by
    independent reconstruction (own simulator, no proposer code); the reviewer also verified this
    document''s collision handling is the CORRECT one (the sibling iff document''s Lemma 5.3
    handles the same point wrongly), and its Cor. 7.3 (R_sat in {1, infinity}) REFUTES the iff
    document''s "R_sat <= d" claim (counterexample: non-interleaved Steane, d_eff = 2 < d = 3,
    R_sat = infinity). COMPLETE proposer-level proof on disk
    (artifacts/circdist_lift_nonint_proof_20260820.md, Theorem 7.1, 2026-08-20), no independent
    review yet. Both directions proved: >= by the augmentation chain map, <= by a
    weight-preserving section from horizontal representatives; non-interleaving collapses all
    per-qubit timestamp comparisons to one global X-before-Z bit, so residuals are measured
    atomically with uniform flavour. STRONGER THAN COMMISSIONED: the graph-like assumption is
    defined and never used — material, since Steane and the Gross code are NOT graph-like, so
    CIRCDIST.gross''s reliance on the non-interleaved equality is licensed only by this wider
    scope. CORRECTION to the recon sketch: "G_circ splits into R disjoint copies of G_eff" is
    FALSE (28.4 percent of elementary faults are non-horizontal); the proved statement is
    CONTAINMENT of R pairwise-disjoint copies via sections, which is all the upper bound needs.
    Definitions sharpened: d_eff indexes residual CLASSES; both temporal boundary detectors are
    load-bearing; two inequivalent non-interleaved flavours (u = s vs u = 0); horizontality is
    per class. Bonus Cor. 7.3 (input to CIRCDIST.sat): d_R is CONSTANT in R for non-interleaved
    schedules, so R_sat is in {1, infinity} with no transfer matrix needed. Corroboration runs:
    12/12 configurations, 10233/10233 faults match the detector-chain formula; on the interleaved
    Steane witness the proof fails exactly at Lemma 5.4 (three hooks with no horizontal
    representative) — a clean localization of where interleaving breaks it.'
  basis:
