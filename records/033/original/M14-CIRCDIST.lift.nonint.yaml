      locator: Theorem 7.1 verdict
      reviewed_hash: sha256:864bcc604035c7124b7fa23977e00375862520a28f347d092453ddd89b6fed4e
    runs:
    - path: artifacts/circdist_lift_nonint_proof_20260820.md
      kind: run
      scope: Model corroboration of the proof (not the proof itself) — 12 schedule/code
        configurations, both temporal boundaries, exhaustive d_circ = d_eff checks.
      result: 10233/10233 faults match the detector-chain formula; witness fires 0 detectors in
        12/12; exhaustive d_circ = d_eff in 12/12; interleaved-Steane failure isolated to Lemma
        5.4 exactly.
    evidence:
    - path: artifacts/circdist_lift_nonint_proof_20260820.md
      kind: text
