id: CIRCDIST.lift.gap-example
role: proof
aliases:
- LIFT-GAP-EXAMPLE
claim: There exists an explicit legal interleaved single-ancilla CNOT syndrome-extraction circuit
  with d_circ strictly greater than d_eff; witnessed at [[4,2,2]] by measurement-consistent
  depth-7 interleaved schedules (3 of the 176 consistent ones) with d_eff = 1 and d_circ = 2,
  while non-interleaved circuits with identical within-check CNOT orders (hence identical residual
  set and d_eff) have d_circ = 1; and at Steane [[7,1,3]] by an interleaved depth-8 schedule with
  d_eff = 2 and d_circ = 3 whose identical-orders non-interleaved partner has d_circ = 2.
assessment:
  level: CERTIFIED*
  caveats:
  - Single same-stack (Opus 5) review; no cross-stack or human verification yet.
  - Schedule-space convention corrected by the review — under the frozen idle-layer-compression
    rule the depth-7 [[4,2,2]] denominator is 44, not 176 (witnesses unaffected); depth-8
    witnesses drop 26 to 5 under compression.
  - Sector scopes as stated — the Steane witness is Z-memory (X-memory gives 2); one [[4,2,2]]
    witness lifts both sectors.
  summary: 'Promoted NUMERICAL -> CERTIFIED* 2026-08-20: independent adversarial review
    (artifacts/circdist_numerical_review_20260820.md, items 1-2) CONFIRMS the measurement
    consistency constraint (re-derived from scratch, validated 524/524 against stim determinism),
    the repaired [[4,2,2]] witnesses and their d_circ = 1 non-interleaved partners at R = 2..5,
    the invalidity of the retracted depth-5 circuit, and the Steane instance (independent
    reconstruction, 9936 DEM columns cross-validated, 0 disagreements).
    WITNESS REPAIRED 2026-08-20 by the d3 gate: the original depth-5 [[4,2,2]] circuit VIOLATES a
    validity constraint the recon missed (for every X/Z check pair the back-propagation count
    #{q in both supports : t(q->b) < t(a->q)} must be EVEN, else detectors are non-deterministic
    and stim refuses the DEM — the Z ancilla''s |0> is not an X eigenstate); the claim survives
    with repaired witnesses (3/176 consistent depth-7 schedules; plus the stronger Steane instance
    with g(C) = 1 at d_eff = 2, Z memory sector). The independent review MUST check the validity
    constraint and the repaired witnesses, not the retracted depth-5 circuit.
    Established in the 2026-08-20 recon session by exhaustive weight-1 and weight-2 fault
    enumeration with a purpose-written ~200-line F2 propagator (no stim/pymatching available),
    stable for R = 2..5 rounds; the core is hand-checkable. Mechanism: the hook fault firing no
    detector in the non-interleaved circuit fires exactly two in the interleaved one — the same
    Z-check in consecutive rounds, a purely timelike edge of net voltage 1; one added
    measurement-flip cancels it exactly, giving a weight-2 closed lift. This is the smallest
    instance of the conjectured d_circ = |gamma| + repair-cost formula. Also NUMERICAL evidence
    that d_eff depends only on within-check CNOT orders, making the completion gap a function of
    the interleaving pattern alone (the A/B experimental design).'
  basis:
    reviews:
    - path: artifacts/circdist_numerical_review_20260820.md
      kind: review
      scope: Adversarial independent review of the validity constraint, the repaired [[4,2,2]]
        witnesses, the retracted circuit, and the Steane instance, with the reviewer's own
        independently built simulator and schedules.
      locator: Items 1 and 2
      reviewed_hash: sha256:487340464e4d0c6b6820d134e40bcda128ed400f131806fe091deedd64a5769c
    runs:
    - path: artifacts/circdist_lift_recon_20260820.md
      kind: run
      scope: Exhaustive weight-1/weight-2 fault enumeration for the [[4,2,2]] interleaved and
        non-interleaved A/B pair, R = 2..5, purpose-written F2 propagator (code inline in the
        artifact).
      result: Interleaved depth-5 circuit has d_eff = 1 and d_circ = 2; the non-interleaved
        circuit with identical within-check orders has d_circ = 1; the separating hook fires two
        timelike detectors (same Z-check, consecutive rounds) and one added measurement flip
        closes the lift at weight 2. Stable for R = 2..5.
    - path: artifacts/circdist_lift_d3gate_20260820.md
      kind: run
      scope: Validity-constrained exhaustive enumeration — [[4,2,2]] all 176 consistent depth-7
        schedules; Steane [[7,1,3]] depth-8 (60256 checks); rotated d=3 surface (26570 schedules,
        2304 order sets, 87000 criterion checks); stim 1.16.0 cross-validation.
      result: Original depth-5 witness invalid (odd back-propagation count); repaired [[4,2,2]]
        witnesses 3/176 with d_circ = 2 > d_eff = 1; Steane interleaved d_eff = 2, d_circ = 3 vs
        non-interleaved 2 (g = 1, R = 2..5); surface code gap provably 0 across the family;
        formula d_circ = min(|gamma| + repair) agreed 5129/5129.
    evidence:
    - path: artifacts/circdist_lift_recon_20260820.md
      kind: text
